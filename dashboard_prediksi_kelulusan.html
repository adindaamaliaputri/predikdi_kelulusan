<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Monitoring Kelulusan - Versi Final</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <style>
        :root {
            --primary: #2563eb; --success: #16a34a; --warning: #ca8a04; --danger: #dc2626; --bg: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); padding: 20px; color: #1e293b; }
        .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }
        .nav-btn { padding: 8px 16px; border: 1px solid #e2e8f0; background: white; cursor: pointer; border-radius: 6px; font-weight: 600; font-size: 13px; }
        .nav-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .page { display: none; }
        .page.active { display: block; }

        /* Metric Cards */
        .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 25px; }
        .m-card { padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; cursor: pointer; background: #fff; transition: 0.2s; text-align: center;}
        .m-card.selected { border: 2px solid var(--primary); background: #f0f7ff; }
        .m-label { font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: 700; }
        .m-value { font-size: 24px; font-weight: 800; }

        /* Table */
        .table-wrap { border: 1px solid #e2e8f0; border-radius: 10px; overflow-y: auto; max-height: 400px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        thead { position: sticky; top: 0; z-index: 10; background: #f8fafc; }
        th { padding: 12px; text-align: left; color: #64748b; border-bottom: 2px solid #e2e8f0; }
        td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; color: white; text-transform: uppercase; }

        /* Simulator Styles sesuai permintaan */
        .grid-split { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 20px; }
        .input-box { margin-bottom: 15px; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #f1f5f9; }
        .input-box label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        input[type=range] { width: 100%; accent-color: var(--primary); cursor: pointer; }

        .reko-card { margin-top: 20px; text-align: left; background: #fcfcfc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; }
        .reko-title { font-weight: bold; font-size: 13px; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; color: var(--warning); }
        .reko-item { font-size: 12px; margin-bottom: 8px; line-height: 1.4; color: #475569; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Dashboard Analisis Kelulusan Mahasiswa</h2>
        <div>
            <button id="btn-pimpinan" class="nav-btn active" onclick="showPage('pimpinan')">Monitoring Data</button>
            <button id="btn-mahasiswa" class="nav-btn" onclick="showPage('mahasiswa')">Simulator Prediksi AI</button>
        </div>
    </div>

    <div id="page-pimpinan" class="page active">
        <div class="metrics">
            <div class="m-card selected" id="card-all" onclick="filterData('all')"><div class="m-label">Total</div><div class="m-value">150</div></div>
            <div class="m-card" onclick="filterData('Tepat Waktu')"><div class="m-label">Tepat Waktu</div><div class="m-value" style="color:var(--success)">95</div></div>
            <div class="m-card" onclick="filterData('Berisiko')"><div class="m-label">Berisiko</div><div class="m-value" style="color:var(--warning)">30</div></div>
            <div class="m-card" onclick="filterData('Terlambat')"><div class="m-label">Terlambat</div><div class="m-value" style="color:var(--danger)">25</div></div>
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>No</th><th>IPK</th><th>SKS</th><th>MK Gagal</th><th>Skripsi</th><th>Bimbingan</th><th>Status</th></tr></thead>
                <tbody id="main-table-body"></tbody>
            </table>
        </div>
    </div>

    <div id="page-mahasiswa" class="page">
        <div class="grid-split">
            <div class="simulator">
                <h3>Simulator Prediksi AI</h3>
                <p style="font-size: 12px; color: #64748b; margin-bottom: 15px;">Geser parameter untuk melihat prediksi dan rekomendasi.</p>
                
                <div class="input-box">
                    <label>IPK: <span id="v_ipk">3.0</span></label>
                    <input type="range" id="in_ipk" min="1.0" max="4.0" step="0.1" value="3.0" oninput="runAI()">
                </div>
                <div class="input-box">
                    <label>Jumlah MK Gagal: <span id="v_gagal">0</span></label>
                    <input type="range" id="in_gagal" min="0" max="15" value="0" oninput="runAI()">
                </div>
                <div class="input-box">
                    <label>SKS Lulus: <span id="v_sks">144</span></label>
                    <input type="range" id="in_sks" min="0" max="160" value="144" oninput="runAI()">
                </div>
                <div class="input-box">
                    <label>Status Skripsi (0-7): <span id="v_skrip">0</span></label>
                    <input type="range" id="in_skrip" min="0" max="7" value="0" oninput="runAI()">
                </div>
                <div class="input-box">
                    <label>Jumlah Bimbingan: <span id="v_bimb">0</span></label>
                    <input type="range" id="in_bimb" min="0" max="30" value="0" oninput="runAI()">
                </div>
            </div>

            <div class="results">
                <div style="background: #fff; border: 2px solid #f1f5f9; padding: 20px; border-radius: 12px; text-align: center;">
                    <div id="res-icon" style="font-size: 40px;">🔴</div>
                    <h3 id="res-label" style="color: var(--danger);">Terlambat</h3>
                    <div id="res-perc" style="font-weight: bold; color: var(--primary);">Probabilitas Tepat Waktu: 20%</div>
                    
                    <div id="ai-rekomendasi-box" class="reko-card">
                        <div class="reko-title"><i class="ti ti-bulb"></i> Rekomendasi Sistem:</div>
                        <div id="reko-list-content">
                            </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const dataset = [];
    function generateData() {
        for(let i=1; i<=150; i++) {
            let status = i <= 95 ? 'Tepat Waktu' : (i <= 125 ? 'Berisiko' : 'Terlambat');
            dataset.push({
                no: i,
                ipk: status === 'Tepat Waktu' ? (3.4+Math.random()*0.5).toFixed(2) : (2.5+Math.random()*0.8).toFixed(2),
                sks: status === 'Tepat Waktu' ? 144+Math.floor(Math.random()*10) : 100+Math.floor(Math.random()*30),
                gagal: status === 'Tepat Waktu' ? Math.floor(Math.random()*2) : Math.floor(Math.random()*8),
                skrip: status === 'Tepat Waktu' ? 6 : 2,
                bimb: status === 'Tepat Waktu' ? 15 : 4,
                status: status
            });
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('main-table-body');
        tbody.innerHTML = data.map(d => `
            <tr>
                <td>${d.no}</td>
                <td><b>${d.ipk}</b></td>
                <td>${d.sks}</td>
                <td>${d.gagal}</td>
                <td>Lvl ${d.skrip}</td>
                <td>${d.bimb}</td>
                <td><span class="badge" style="background:${d.status==='Tepat Waktu'?'var(--success)':(d.status==='Berisiko'?'var(--warning)':'var(--danger)')}">${d.status}</span></td>
            </tr>
        `).join('');
    }

    function runAI() {
        const ipk = parseFloat(document.getElementById('in_ipk').value);
        const gagal = parseInt(document.getElementById('in_gagal').value);
        const sks = parseInt(document.getElementById('in_sks').value);
        const skrip = parseInt(document.getElementById('in_skrip').value);
        const bimb = parseInt(document.getElementById('in_bimb').value);

        document.getElementById('v_ipk').innerText = ipk;
        document.getElementById('v_gagal').innerText = gagal;
        document.getElementById('v_sks').innerText = sks;
        document.getElementById('v_skrip').innerText = skrip;
        document.getElementById('v_bimb').innerText = bimb;

        // Logika Probabilitas (0-100)
        let prob = (ipk / 4 * 40) + (sks / 144 * 30) + (skrip / 7 * 20) + (bimb / 30 * 10) - (gagal * 3);
        prob = Math.max(5, Math.min(99, Math.round(prob)));

        const resIcon = document.getElementById('res-icon');
        const resLabel = document.getElementById('res-label');
        const resPerc = document.getElementById('res-perc');
        const rekoContent = document.getElementById('reko-list-content');

        resPerc.innerText = `Probabilitas Tepat Waktu: ${prob}%`;
        rekoContent.innerHTML = "";

        if (prob >= 80) {
            resIcon.innerText = "🟢"; resLabel.innerText = "Tepat Waktu"; resLabel.style.color = "var(--success)";
            rekoContent.innerHTML = `<div class="reko-item">✅ Pertahankan performa akademik Anda.</div><div class="reko-item">✅ Segera daftar sidang munaqasyah jika skripsi selesai.</div>`;
        } else if (prob >= 50) {
            resIcon.innerText = "🟡"; resLabel.innerText = "Berisiko"; resLabel.style.color = "var(--warning)";
            if(skrip < 4) rekoContent.innerHTML += `<div class="reko-item">🟡 Fokus pada penyelesaian Bab 1-3.</div>`;
            if(bimb < 10) rekoContent.innerHTML += `<div class="reko-item">🟡 Tingkatkan frekuensi bimbingan dengan dosen.</div>`;
        } else {
            resIcon.innerText = "🔴"; resLabel.innerText = "Terlambat"; resLabel.style.color = "var(--danger)";
            if(ipk < 3.0) rekoContent.innerHTML += `<div class="reko-item">🔴 IPK di bawah 3.0. Konsultasi dengan Dosen Wali.</div>`;
            if(skrip < 2) rekoContent.innerHTML += `<div class="reko-item">🟠 Kejar progress skripsi (saat ini level ${skrip}).</div>`;
            if(bimb < 5) rekoContent.innerHTML += `<div class="reko-item">🔵 Intensitas bimbingan sangat rendah.</div>`;
        }
    }

    function showPage(p) {
        document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('page-' + p).classList.add('active');
        document.getElementById('btn-' + p).classList.add('active');
    }

    function filterData(status) {
        if(status === 'all') renderTable(dataset);
        else renderTable(dataset.filter(d => d.status === status));
    }

    window.onload = () => { generateData(); renderTable(dataset); runAI(); };
</script>
</body>
</html>
